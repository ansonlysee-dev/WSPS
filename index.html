<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>WSPS — Washing Sample Projection System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEECE6;
    --panel:#FFFFFF;
    --line:#D9D5C9;
    --ink:#1E1B16;
    --ink-soft:#6B6659;
    --accent:#2F4665;
    --accent-soft:#DDE4EC;
    --amber:#B8791E;
    --amber-soft:#F6E9D3;
    --red:#A73B2E;
    --red-soft:#F5DEDA;
    --deep-red:#6E2018;
    --deep-red-soft:#EBD1CC;
    --green:#3F6B4B;
    --green-soft:#DEEBE2;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .num, table td.num, input.num{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:var(--accent);}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  ::selection{background:var(--accent-soft);}

  /* ---- shell ---- */
  .app{max-width:1320px;margin:0 auto;padding:0 24px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:28px 0 18px;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:16px;
  }
  .brandmark{display:flex;flex-direction:column;gap:2px;}
  .brandmark .zh{font-size:22px;font-weight:700;letter-spacing:0.02em;}
  .brandmark .en{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:0.08em;}
  .identity{display:flex;gap:10px;align-items:center;}
  .identity input, .identity select{
    font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);
    background:var(--panel);border-radius:var(--radius);color:var(--ink);
  }
  .identity label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .identity .field{display:flex;flex-direction:column;}

  nav.tabs{
    display:flex;gap:2px;margin:18px 0 22px;border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;padding:10px 16px;font-size:13.5px;
    color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;}
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.tab-admin{background:var(--amber-soft);color:#7A521A;font-weight:600;border-radius:3px 3px 0 0;}
  nav.tabs button.tab-admin.active{border-bottom-color:var(--amber);color:#7A521A;}

  h1.page-title{font-size:19px;margin:0 0 4px;font-weight:700;}
  p.page-sub{color:var(--ink-soft);margin:0 0 20px;font-size:13px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .panel h2{font-size:14.5px;margin:0 0 12px;font-weight:600;}

  /* ---- overview month cards ---- */
  .month-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
  .month-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px 16px;position:relative;}
  .month-card .mlabel{font-weight:700;font-size:14px;margin-bottom:10px;}
  .month-card .metric-row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;color:var(--ink-soft);}
  .month-card .metric-row .v{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .bar-track{height:6px;background:#EDEBE4;border-radius:2px;overflow:hidden;margin:6px 0 8px;}
  .bar-fill{height:100%;background:var(--accent);}
  .bar-fill.warn{background:var(--amber);}
  .bar-fill.alert{background:var(--red);}
  .bar-fill.deep{background:var(--deep-red);}
  .status-chip{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:600;
    letter-spacing:0.01em;
  }
  .status-chip.normal{background:var(--green-soft);color:var(--green);}
  .status-chip.near{background:var(--amber-soft);color:var(--amber);}
  .status-chip.at{background:var(--red-soft);color:var(--red);}
  .status-chip.over{background:var(--deep-red-soft);color:var(--deep-red);}

  /* ---- matrix table ---- */
  .matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.matrix{border-collapse:collapse;width:100%;min-width:900px;}
  table.matrix th, table.matrix td{border:1px solid var(--line);padding:0;font-size:12.5px;}
  table.matrix thead th{
    background:var(--ink);color:#fff;padding:8px 10px;text-align:center;position:sticky;top:0;z-index:2;
    font-weight:600;
  }
  table.matrix thead th.brandcol{text-align:left;position:sticky;left:0;z-index:3;}
  table.matrix tbody td.brandcol{
    position:sticky;left:0;background:var(--panel);font-weight:600;padding:9px 12px;z-index:1;
    border-right:2px solid var(--line);white-space:nowrap;
  }
  table.matrix tbody tr:nth-child(even) td.brandcol{background:#FAF9F5;}
  .cellwrap{padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:118px;}
  .cellwrap .pair{display:flex;gap:4px;align-items:center;}
  .cellwrap input{
    width:68px;font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);
    border-radius:2px;padding:3px 6px;text-align:right;-moz-appearance:textfield;appearance:textfield;
  }
  .cellwrap input::-webkit-outer-spin-button,.cellwrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .cellwrap input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .cellwrap .tag{font-size:9.5px;color:var(--ink-soft);width:14px;}
  .cellwrap.blank{color:#BEB9AC;}
  .rowtotal{padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;background:#FAF9F5;}
  .weekfoot td{padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#F5F3EC;text-align:center;}
  .weekfoot td.brandcol{background:#F5F3EC;}

  /* ---- generic table ---- */
  table.plain{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.plain th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);font-weight:600;font-size:12px;color:var(--ink-soft);}
  table.plain td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.plain tr:hover td{background:#FAF9F5;}

  .btn{
    border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 14px;border-radius:var(--radius);
    font-size:12.5px;font-weight:600;
  }
  .btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:4px 10px;font-size:11.5px;}

  .field-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}
  .field input, .field select{
    font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);
    min-width:120px;
  }

  .badge{font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .muted{color:var(--ink-soft);}
  .warn-banner{
    display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--radius);
    font-size:12.5px;margin-bottom:14px;border:1px solid transparent;
  }
  .warn-banner.near{background:var(--amber-soft);border-color:var(--amber);color:#7A521A;}
  .warn-banner.at{background:var(--red-soft);border-color:var(--red);color:#7A2A20;}
  .warn-banner.over{background:var(--deep-red-soft);border-color:var(--deep-red);color:var(--deep-red);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,18,14,0.55);display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:440px;width:92%;border-top:4px solid var(--red);}
  .modal.deep{border-top-color:var(--deep-red);}
  .modal h3{margin:0 0 10px;font-size:15px;}
  .modal p{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .footnote{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .role-gate{padding:40px;text-align:center;color:var(--ink-soft);}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 12px;font-size:12px;}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .save-hint{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:8px 14px;
    border-radius:var(--radius);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;}
  .save-hint.show{opacity:0.92;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:800px){.grid2{grid-template-columns:1fr;}}
  .audit{font-size:11px;color:var(--ink-soft);}
  select.status-select{font-size:11.5px;}
  .version-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
  .update-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;margin:12px 0 14px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-size:12.5px;border-radius:var(--radius);}
  .update-banner button{border:1px solid var(--accent);background:#fff;color:var(--accent);padding:4px 9px;border-radius:var(--radius);font-size:11.5px;white-space:nowrap;}
  .matrix-tools{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .matrix-tools .field{min-width:220px;}
  .cellwrap.invalid{background:var(--red-soft);}
  .cellwrap.invalid input{border-color:var(--red);}
  .cell-warning{font-size:9.5px;color:var(--red);line-height:1.2;}
  .risk-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:11.5px;color:var(--ink-soft);}
  .risk-legend .legend-item{display:inline-flex;align-items:center;gap:4px;}
  .risk-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12);}
  .dot.normal{background:var(--green);}.dot.near{background:var(--amber);}.dot.at{background:var(--red);}.dot.over{background:var(--deep-red);}
  .cell-meta{font-size:9px;color:var(--ink-soft);line-height:1.15;margin-top:2px;white-space:nowrap;}
  .danger-note{font-size:11.5px;color:var(--deep-red);margin:7px 0 0;}
  .sync-status{display:flex;align-items:center;gap:8px;padding:7px 11px;margin:10px 0 14px;border:1px solid var(--line);background:#FAF9F5;font-size:11.5px;color:var(--ink-soft);}
  .sync-status.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);}.sync-status.saving{border-color:var(--amber);background:var(--amber-soft);color:#7A521A;}.sync-status.error{border-color:var(--red);background:var(--red-soft);color:var(--red);}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;}.analysis-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 16px;}.analysis-card{border:1px solid var(--line);padding:10px 12px;background:#FAF9F5;}.analysis-card .label{font-size:11px;color:var(--ink-soft);}.analysis-card .value{font:600 18px 'IBM Plex Mono',monospace;margin-top:3px;}.analysis-chart{display:flex;flex-direction:column;gap:8px;margin:12px 0 18px;}.chart-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 80px;align-items:center;gap:8px;font-size:11.5px;}.chart-track{height:18px;background:#EEECE6;border-radius:2px;overflow:hidden;}.chart-forecast{height:8px;background:var(--accent);}.chart-completion{height:8px;background:var(--green);margin-top:2px;}.chart-legend{font-size:11px;color:var(--ink-soft);margin:4px 0 8px;}.chart-legend span{margin-right:12px;}.chart-legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;}@media(max-width:700px){.chart-row{grid-template-columns:100px 1fr 62px;font-size:10.5px;}}
  @media (max-width:700px){
    .app{padding:0 10px 56px;}
    header.top{padding:18px 0 14px;align-items:flex-start;}
    .brandmark .zh{font-size:17px;line-height:1.25;max-width:220px;}
    .identity{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:7px;}
    .identity .field input,.identity .field select{width:100%!important;min-width:0;}
    nav.tabs{margin:12px 0 16px;}
    nav.tabs button{padding:9px 11px;font-size:12px;}
    .matrix-tools{width:100%;}
    .matrix-tools .field{min-width:100%;}
    .matrix-tools .field input{width:100%;}
    .cellwrap input{min-height:30px;font-size:13px;}
    table.matrix{min-width:900px;}
  }
@media print{
  header.top, nav.tabs, .no-print, .save-hint { display:none !important; }
  body{ background:#fff; }
  .app{ max-width:100%; padding:0; }
  .panel{ break-inside:avoid; border:1px solid #999; }
  table.plain{ break-inside:auto; }
  table.plain tr{ break-inside:avoid; }
}

<!-- Firebase Firestore 共用資料層：GitHub Pages 外部部署使用 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBeRtl_na0JYa7Ostmbbu1h-xGn881Min0",
    authDomain: "wsps---zsyd.firebaseapp.com",
    projectId: "wsps---zsyd",
    storageBucket: "wsps---zsyd.firebasestorage.app",
    messagingSenderId: "194308230016",
    appId: "1:194308230016:web:d70cd0ba1d8e55288fcf65"
  };
  try {
    const db = getFirestore(initializeApp(firebaseConfig));
    const ref = doc(db, "wsps", "data");
    window.firebaseGetData = async () => {
      const snap = await getDoc(ref);
      if (!snap.exists()) return null;
      const d = snap.data();
      return { value: d.value, updatedAt: d.updatedAt };
    };
    window.firebaseSetData = async (value, expectedVersion) => {
      const snap = await getDoc(ref);
      const current = snap.exists() ? snap.data().updatedAt : null;
      if (expectedVersion != null && current != null && current !== expectedVersion) {
        const err = new Error('版本衝突：資料已被其他人更新');
        err.isVersionConflict = true;
        throw err;
      }
      const newVersion = Date.now();
      await setDoc(ref, { value, updatedAt: newVersion });
      return newVersion;
    };
    window.firebaseSaveBackupOnce = async (key, value) => {
      const bref = doc(db, "wsps", "backup-" + key);
      const snap = await getDoc(bref);
      if (!snap.exists()) { await setDoc(bref, { value, savedAt: Date.now() }); return true; }
      return false;
    };
    window.firebaseGetBackup = async (key) => {
      const snap = await getDoc(doc(db, "wsps", "backup-" + key));
      return snap.exists() ? snap.data().value : null;
    };
    window.firebaseListen = (callback) => onSnapshot(ref, snap => {
      if (snap.exists()) { const d = snap.data(); callback(d.value, d.updatedAt); }
    });
    window.firebaseError = null;
  } catch (error) { window.firebaseError = error; }
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<script>

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }

  // 跨月業務週歸屬規則：以該週落在哪個月份的日子較多為準（多數日子原則），
  // 該週只會顯示在歸屬的那個月，不會在另一個月重複出現。
  let best = null, bestCount = -1;
  monthsMeta.forEach(m=>{
    const overlapStart = clipStart > m.start ? clipStart : m.start;
    const overlapEnd = clipEnd < m.end ? clipEnd : m.end;
    if(overlapStart <= overlapEnd){
      const count = Math.round((overlapEnd - overlapStart) / 86400000) + 1;

}

/* 一次性硬重設（依業主明確指示）：清除所有原有月份／業務週／預測資料（客戶主檔保留），

/* ============================= 儲存／同步（v3）=============================
   - 輸入後延遲約 1 秒才儲存（連續輸入合併為一次寫入），不再每離開一格就即時寫入並重畫整個表。
   - 儲存撞版時：不再放棄，而是讀取最新雲端資料，逐筆（以 id 為單位）三方合併，再重試儲存。
   - 收到他人更新時：同樣三方合併，只在畫面上有變化時才更新；若你正在輸入，等你離開該格後才刷新，不會洗走正在輸入的內容。 */
let BASE_STATE = null;     // 最後一次與雲端同步成功時的資料快照（三方合併的「共同祖先」）
let DIRTY = false, DIRTY_SEQ = 0, SAVE_TIMER = null, NEEDS_RENDER = false, MERGED_ON_CONFLICT = false;
let PERSIST_QUEUE = Promise.resolve();
const STATE_DEFAULTS = ()=>({brands:[],months:[],weeks:[],forecasts:[],completions:[]});
function cloneState(o){ return JSON.parse(JSON.stringify(o)); }
function nz(v){ return v==null ? '—' : v; } // 未填報顯示為「—」，與填 0 區分

function mergeById(base, local, remote){
  const baseMap = new Map((base||[]).map(x=>[x.id, JSON.stringify(x)]));
  const localMap = new Map((local||[]).map(x=>[x.id, x]));
  const out = [], seen = new Set();
  (remote||[]).forEach(r=>{
    seen.add(r.id);
    const l = localMap.get(r.id), b = baseMap.get(r.id);
    if(!l){ out.push(r); return; }                       // 本機沒有（或只有雲端有）：用雲端版本
    const lj = JSON.stringify(l), rj = JSON.stringify(r);
    if(b===undefined){ out.push(lj===rj ? r : l); return; }
    const localChanged = lj!==b, remoteChanged = rj!==b;
    if(localChanged && !remoteChanged) out.push(l);      // 只有我改過：保留我的
    else if(!localChanged) out.push(r);                  // 我沒改：採用雲端（他人）的
    else out.push(l);                                    // 雙方都改同一筆：以我最新的修改為準
  });
  (local||[]).forEach(l=>{
    if(seen.has(l.id)) return;
    const b = baseMap.get(l.id);
    if(b===undefined || JSON.stringify(l)!==b) out.push(l); // 我新增或修改過、雲端沒有的
  });
  return out;
}
function mergeStates(base, local, remote){
  const out = Object.assign({}, remote);
  ['brands','months','weeks','forecasts','completions'].forEach(k=>{
    out[k] = mergeById(base && base[k], local[k], remote[k]);
  });
  Object.keys(local).forEach(k=>{ if(k.startsWith('_') && local[k] && !out[k]) out[k]=local[k]; }); // 遷移旗標取聯集
  return out;
}

function persist(opts){
  PERSIST_QUEUE = PERSIST_QUEUE.then(()=>persistNow(opts||{})).catch(e=>console.error(e));
  return PERSIST_QUEUE;
}
async function persistNow(opts){
  if(LOAD_FAILED){ alert('目前無法讀取雲端資料，為避免覆蓋已停止所有儲存。請重新整理頁面後再試。'); return; }
  const seq = DIRTY_SEQ;
  let succeeded = false;
  try{
    SAVING = true;
    CLOUD_ERROR = null;
    for(let attempt=0; attempt<4 && !succeeded; attempt++){
      try{
        await storageSet(JSON.stringify(STATE));
        succeeded = true;
      }catch(e){
        if(e && e.isVersionConflict && USING_FIREBASE){
          const r = await withTimeout(window.firebaseGetData(), 15000, '讀取雲端資料');
          if(!r) throw e;
          REMOTE_VERSION = r.updatedAt;
          if(!opts.overwrite){
            const remote = Object.assign(STATE_DEFAULTS(), JSON.parse(r.value));
            STATE = mergeStates(BASE_STATE, STATE, remote);
            BASE_STATE = cloneState(remote);
            MERGED_ON_CONFLICT = true;
          }
          continue; // 以最新版本號重試
        }
        throw e;
      }
    }
    if(succeeded){
      BASE_STATE = cloneState(STATE);
      if(DIRTY_SEQ===seq) DIRTY = false;
    } else {
      CLOUD_ERROR = new Error('多次儲存都與他人更新衝突，請稍後再試');
    }
  }catch(e){
    CLOUD_ERROR = e;
    setSyncStatus('error','同步失敗：'+(e.message||'未知錯誤'));
    console.error('儲存失敗', e);
  }finally{
    SAVING = false;
    const hint = document.getElementById('saveHint');
    if(hint){
      hint.textContent = succeeded ? '已同步' : '未同步：請檢查網絡或稍後再試';
      hint.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>hint.classList.remove('show'), 2200);
    }
  }
  if(succeeded && MERGED_ON_CONFLICT){ MERGED_ON_CONFLICT = false; softRender(); }
}
// 輸入後呼叫：標記有未儲存修改，約 1 秒後寫入雲端；並在下一個畫面週期更新畫面（保留游標）
function commitEdit(){
  DIRTY = true; DIRTY_SEQ++;
  const hint = document.getElementById('saveHint');
  if(hint){ hint.textContent = '儲存中…'; hint.classList.add('show'); }
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(()=>{ persist(); }, 1000);
  setTimeout(renderKeepFocus, 0);
}
function renderKeepFocus(){
  const ae = document.activeElement;
  let info = null;
  if(ae && ae.tagName==='INPUT' && ae.closest && ae.closest('#app')){
    info = {ds:Object.assign({}, ae.dataset), value:ae.value};
  }
  render();
  if(info){
    const sel = Object.keys(info.ds).map(k=>`[data-${k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase())}="${info.ds[k]}"]`).join('');
    const el = sel ? document.querySelector('#app input'+sel) : null;
    if(el){
      if(el.value!==info.value) el.value = info.value;
      el.focus();
      try{ el.select(); }catch(e){}
    }
  }
}
// 遠端更新／合併後使用：若使用者正在輸入框內打字，先不重畫，等離開輸入框後才刷新
function softRender(){
  const ae = document.activeElement;
  if(ae && ae.tagName==='INPUT' && ae.closest && ae.closest('#app')){ NEEDS_RENDER = true; return; }
  NEEDS_RENDER = false;
  render();
}
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(!NEEDS_RENDER) return;
    const ae = document.activeElement;
    if(ae && ae.tagName==='INPUT' && ae.closest && ae.closest('#app')) return;
    NEEDS_RENDER = false; render();

});

  if(DIRTY){ e.preventDefault(); e.returnValue = ''; }
});
let saveTimer=null;

  const el = document.getElementById('saveHint');

function seedInitialData(){
  STATE.brands = SEED_BRANDS.map(name=>({id:uid('brand'), name, active:true}));
  // 業務週採「週六至週五」為一週期（7 個日曆日一週，可跨月），未來 6 個月自動產生預設週別
  const today = new Date();
  const months = [];
  for(let i=0;i<6;i++){
    const md = new Date(today.getFullYear(), today.getMonth()+i, 1);
    const ym = md.getFullYear()+'-'+pad(md.getMonth()+1);
    const monthId = uid('month');
    const monthStart = new Date(md.getFullYear(), md.getMonth(), 1);
    const monthEnd = new Date(md.getFullYear(), md.getMonth()+1, 0);
    months.push({id:monthId, ym, start:monthStart, end:monthEnd});
    STATE.months.push({id:monthId, ym, pieceCapOverride:null, overrideReason:'', overrideBy:'', overrideAt:''});
  }
  const rangeStart = months[0].start;
  const rangeEnd = months[months.length-1].end;
  // 找到範圍內第一個週六
  let weekStart = new Date(rangeStart);
  while(weekStart.getDay() !== 6){ weekStart = addDays(weekStart, -1); }
  while(weekStart <= rangeEnd){
    const weekEnd = addDays(weekStart, 6); // 週六至週五，共 7 個日曆日，可跨月
    const clipStart = weekStart < rangeStart ? rangeStart : weekStart;
    const clipEnd = weekEnd > rangeEnd ? rangeEnd : weekEnd;
    if(clipStart <= clipEnd){
      // 規劃歸屬月份：以業務週開始日所在月份為預設（管理員可於產能日曆頁面調整）
      const owner = ownerMonthByMajority(clipStart, clipEnd, months) || months[0];
      const days = Math.min(MAX_WORKDAYS_PER_WEEK, Math.round((clipEnd - clipStart) / 86400000) + 1);
      STATE.weeks.push({
        id: uid('week'), monthId: owner.id, startDate: fmtDate(clipStart), endDate: fmtDate(clipEnd),
        workdays: days, styleCapOverride:null, pieceCapPlanOverride:null, pieceCapOpsOverride:null,
        overrideReason:'', overrideBy:'', overrideAt:''
      });
    }
    weekStart = addDays(weekStart, 7);
  }
}

          const week = byStart[SEP_WEEKLY_DATA.weeks[idx].start];

        });
      });
    }
  }
  // 8 月補入（僅在 8 月匯入週已有資料時，補上當時找不到的客戶）
  const augMonth = STATE.months.find(m=>m.ym==='2026-08');
  const augWeek = augMonth ? STATE.weeks.find(w=>w.monthId===augMonth.id && w._isMonthlyImportWeek) : null;
  if(augWeek && STATE.forecasts.some(f=>f.weekId===augWeek.id && f.status!=='cancelled')){
    const augIds = new Set([augWeek.id]);
    const aug = HISTORICAL_V2_MONTHLY['2026-08'];

      pushEntries(brand, augWeek, fs, fp, cs, cp, '8月歷史月度合計補入（來源 Excel）');
    });
  }

  STATE._brandRepairV1 = true;
}

/* ============================= 計算邏輯 ============================= */
function weekDefaults(workdays){
  return {
    styleCap: STYLE_PER_DAY*workdays,
    pieceCapPlan: PIECES_PLAN_PER_DAY*workdays,
    pieceCapOps: PIECES_OPS_PER_DAY*workdays
  };
}
function weekCaps(week){
  const d = weekDefaults(week.workdays);
  return {
    styleCap: week.styleCapOverride!=null ? week.styleCapOverride : d.styleCap,
    pieceCapPlan: week.pieceCapPlanOverride!=null ? week.pieceCapPlanOverride : d.pieceCapPlan,
    pieceCapOps: week.pieceCapOpsOverride!=null ? week.pieceCapOpsOverride : d.pieceCapOps,
    defaults: d
  };
}
function activeForecastsForWeek(weekId){
  return STATE.forecasts.filter(f=>f.weekId===weekId && f.status!=='cancelled');
}
function weekTotals(weekId){
  const fs = activeForecastsForWeek(weekId);
  return {
    styles: fs.reduce((s,f)=>s+(f.styles||0),0),
    pieces: fs.reduce((s,f)=>s+(f.pieces||0),0)
  };
}
function weekStatus(week){
  const caps = weekCaps(week);
  const tot = weekTotals(week.id);
  const styleRatio = caps.styleCap>0 ? tot.styles/caps.styleCap : 0;
  const planRatio = caps.pieceCapPlan>0 ? tot.pieces/caps.pieceCapPlan : 0;
  const opsRatio = caps.pieceCapOps>0 ? tot.pieces/caps.pieceCapOps : 0;

  let level = 'normal'; // normal | near | at | over
  let reasons = [];
  if(tot.styles >= caps.styleCap){
    level = 'at';
    reasons.push('本週預計 '+tot.styles+' 款，已達或超過上限 '+caps.styleCap+' 款（超出 '+Math.max(0,tot.styles-caps.styleCap)+' 款）');
  } else if(styleRatio>=0.9){
    if(level==='normal') level='near';
    reasons.push('本週預計 '+tot.styles+' 款，達款數上限 '+caps.styleCap+' 款的 '+Math.round(styleRatio*100)+'%');
  }
  if(tot.pieces >= caps.pieceCapOps){
    level='over';
    reasons.push('本週預計 '+tot.pieces+' 件，已超出 425 件/日操作參考上限 '+caps.pieceCapOps+' 件（超出 '+(tot.pieces-caps.pieceCapOps)+' 件），將標記待 WRD 覆核');
  } else if(tot.pieces >= caps.pieceCapPlan){
    if(level!=='over') level = level==='at' ? 'at' : 'at';
    reasons.push('本週預計 '+tot.pieces+' 件，已達 400 件/日規劃參考 '+caps.pieceCapPlan+' 件（超出 '+(tot.pieces-caps.pieceCapPlan)+' 件）');
  } else if(planRatio>=0.9){
    if(level==='normal') level='near';
    reasons.push('本週預計 '+tot.pieces+' 件，達件數規劃參考 '+caps.pieceCapPlan+' 件的 '+Math.round(planRatio*100)+'%');
  }
  return {level, reasons, caps, tot};
}
function monthCaps(month){
  const weeks = STATE.weeks.filter(w=>w.monthId===month.id);
  const styleCap = weeks.reduce((s,w)=>s+weekCaps(w).styleCap,0);
  const pieceCap = month.pieceCapOverride!=null ? month.pieceCapOverride : MONTH_PIECE_CAP_DEFAULT;
  return {styleCap, pieceCap, weeks};
}
function monthTotals(month){
  const weeks = STATE.weeks.filter(w=>w.monthId===month.id);
  let styles=0, pieces=0;
  weeks.forEach(w=>{ const t=weekTotals(w.id); styles+=t.styles; pieces+=t.pieces; });
  return {styles, pieces};
}
function monthCompletionTotals(month){
  const weeks = STATE.weeks.filter(w=>w.monthId===month.id);
  let styles=0, pieces=0;
  weeks.forEach(w=>{ const t=weekCompletionTotals(w.id); styles+=t.styles; pieces+=t.pieces; });
  return {styles, pieces};
}
function monthStatus(month){
  const caps = monthCaps(month);
  const tot = monthTotals(month);
  let level='normal';
  let reasons=[];
  if(tot.pieces > 10400){
    level='over';
    reasons.push('本月件數已達 '+tot.pieces+' 件，超出高負荷規劃參考上限 10,400 件（超出 '+(tot.pieces-10400)+' 件），需移期、調整資源或作明確管理決定');
  } else if(tot.pieces >= 10000){
    level='at';
    reasons.push('本月件數已達 '+tot.pieces+' 件，落在 10,000–10,400 件高負荷需覆核區間');
  } else if(tot.pieces >= 9000){
    level='near';
    reasons.push('本月件數已達 '+tot.pieces+' 件，接近月度正式基準 10,000 件，需持續監控');
  }
  if(tot.styles > caps.styleCap && caps.styleCap>0){
    if(level==='normal') level='at';
    reasons.push('本月款數 '+tot.styles+' 已超出各週上限合計 '+caps.styleCap+' 款');
  }
  return {level, reasons, caps, tot};
}
function weekLabel(week){
  return week.startDate + ' ~ ' + week.endDate;
}
function brandName(id){ const b=STATE.brands.find(x=>x.id===id); return b?b.name:'(未知客戶)'; }

function currentYm(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function previousYm(){const d=new Date();d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function frontMonths(months){return months.filter(m=>m.ym>=previousYm());}
function defaultMonthId(months){const ym=currentYm();return (months.find(m=>m.ym===ym)||months.find(m=>m.ym>ym)||months[months.length-1]||{}).id||null;}
function historicalMonths(months){return months.filter(m=>m.ym<currentYm());}
function setSyncStatus(status,message){SYNC_STATUS=status;SYNC_MESSAGE=message;LAST_SYNC_AT=Date.now();const el=document.getElementById('syncStatus');if(el){el.className='sync-status '+status;el.innerHTML='<span class="sync-dot"></span><span>'+message+'</span>';}}

}
function latestRecordForCell(brandId, weekId){
  const records = STATE.forecasts.filter(f=>f.brandId===brandId && f.weekId===weekId && f.status!=='cancelled' && !f.itemRef);

}

/* ============================= 資料操作（含稽核）============================= */
function currentUser(){ return SESSION.userName || '(未署名使用者)'; }

function upsertForecast({brandId, weekId, itemRef, styles, pieces, note}, forceStatus){
  itemRef = itemRef || '';
  let existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===weekId && (f.itemRef||'')===itemRef && f.status!=='cancelled');
  const ts = nowStr();
  if(existing){
    existing.history = existing.history || [];
    existing.history.push({at:ts, by:currentUser(), from:{styles:existing.styles, pieces:existing.pieces, note:existing.note}, to:{styles, pieces, note}});
    existing.styles = styles; existing.pieces = pieces; existing.note = note;
    existing.modifiedBy = currentUser(); existing.modifiedAt = ts;
    if(forceStatus) existing.status = forceStatus;
    else if(existing.status==='draft') existing.status='active';
  } else {
    existing = {
      id: uid('fc'), brandId, weekId, itemRef, styles, pieces, note,
      status: forceStatus || 'active',
      createdBy: currentUser(), createdAt: ts, modifiedBy: currentUser(), modifiedAt: ts,
      history: [{at:ts, by:currentUser(), from:null, to:{styles,pieces,note}}]
    };
    STATE.forecasts.push(existing);
  }
  return existing;
}
function cancelForecast(id){
  const f = STATE.forecasts.find(x=>x.id===id);
  if(!f) return;
  if(!canEditForecastCell(f.brandId, STATE.weeks.find(w=>w.id===f.weekId))) return false; // 防禦性檢查：非本品牌、已鎖定週（非 WRD／系統管理員）不可取消
  f.history = f.history||[];
  f.history.push({at:nowStr(), by:currentUser(), from:{status:f.status}, to:{status:'cancelled'}});
  f.status='cancelled'; f.modifiedBy=currentUser(); f.modifiedAt=nowStr();
}

/* ============================= 實質完成數（僅 WRD／系統管理員）============================= */
function completionsForWeek(weekId){
  return STATE.completions.filter(c=>c.weekId===weekId && c.status!=='cancelled');
}
function weekCompletionTotals(weekId){
  const cs = completionsForWeek(weekId).filter(c=>!c.itemRef);
  return {
    styles: cs.reduce((s,c)=>s+(c.styles||0),0),
    pieces: cs.reduce((s,c)=>s+(c.pieces||0),0)
  };
}
function upsertCompletion({brandId, weekId, itemRef, styles, pieces, note}){
  itemRef = itemRef || '';
  let existing = STATE.completions.find(c=>c.brandId===brandId && c.weekId===weekId && (c.itemRef||'')===itemRef && c.status!=='cancelled');
  const ts = nowStr();
  if(existing){
    existing.history = existing.history || [];
    existing.history.push({at:ts, by:currentUser(), from:{styles:existing.styles, pieces:existing.pieces, note:existing.note}, to:{styles, pieces, note}});
    existing.styles = styles; existing.pieces = pieces; existing.note = note;
    existing.modifiedBy = currentUser(); existing.modifiedAt = ts;
  } else {
    existing = {
      id: uid('cm'), brandId, weekId, itemRef, styles, pieces, note,
      status: 'active',
      createdBy: currentUser(), createdAt: ts, modifiedBy: currentUser(), modifiedAt: ts,
      history: [{at:ts, by:currentUser(), from:null, to:{styles,pieces,note}}]
    };
    STATE.completions.push(existing);
  }
  return existing;
}
function variancePct(actual, forecast){
  if(!forecast) return null; // 預測數為 0 或未填報時，相差率沒有意義
  return ((actual - forecast) / forecast) * 100;
}
function fmtVariance(v){
  if(v==null) return '—';
  const sign = v>0 ? '+' : '';
  return sign + v.toFixed(1) + '%';
}
function varianceClass(v){
  if(v==null) return '';
  if(v <= -20) return 'over'; // 完成度嚴重落後
  if(v <= -5) return 'at';
  if(v < 0) return 'near';
  return ''; // 達標或超標，不特別標色
}

  document.querySelectorAll('table.matrix input').forEach(inp=>{
    inp.addEventListener('change', ()=>handleMatrixInputChange(inp));
    inp.addEventListener('paste', (event)=>handleMatrixPaste(event, inp));
  });
}
function handleMatrixInputChange(inp){
  const brandId = inp.dataset.brand, weekId = inp.dataset.week, field = inp.dataset.field;
  let raw = inp.value.trim();
  let val = raw==='' ? null : Math.max(0, Math.floor(Number(raw)));
  if(raw!=='' && (isNaN(val))) { alert('請輸入非負整數'); render(); return; }

  const existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===weekId && f.status!=='cancelled' && !f.itemRef);

  if(!canEditBrand(brandId)){
    alert('此品牌資料只有該品牌登入身份、WRD 或系統管理員可以修改。');
    render();
    return;
  }
  if(!canEditForecastCell(brandId, STATE.weeks.find(w=>w.id===weekId))){
    alert('此業務週已過，數據已鎖定，只有 WRD 或系統管理員可以修改。');
    render();
    return;
  }

  // 未填（null）與填 0 分開：只更新被編輯的那一格，另一格保持原狀（未填就維持空白，不會自動變成 0）
  let styles = existing ? existing.styles : null;
  let pieces = existing ? existing.pieces : null;
  if(field==='styles') styles = val;
  if(field==='pieces') pieces = val;
  if(!existing && val==null){ return; } // 沒有紀錄又沒輸入內容：不需處理
  if(invalidForecastPair(styles, pieces)){
    alert('資料不合理：款數不能多於件數。請先調整數值後再儲存。');
    render();
    return;
  }

  const week = STATE.weeks.find(w=>w.id===weekId);
  const caps = weekCaps(week);
  const projectedTotals = weekTotals(weekId);
  // remove existing contribution before adding projected
  const prevContribStyles = existing? existing.styles||0 : 0;
  const prevContribPieces = existing? existing.pieces||0 : 0;
  const newStyleTotal = projectedTotals.styles - prevContribStyles + (styles||0);
  const newPieceTotal = projectedTotals.pieces - prevContribPieces + (pieces||0);

  const overStyleCap = newStyleTotal >= caps.styleCap && caps.styleCap>0;
  const overOpsCap = newPieceTotal >= caps.pieceCapOps && caps.pieceCapOps>0;
  const overPlanCap = newPieceTotal >= caps.pieceCapPlan && caps.pieceCapPlan>0;

  const doSave = (forceStatus)=>{
    upsertForecast({brandId, weekId, itemRef:'', styles, pieces, note:''}, forceStatus);
    commitEdit();
  };

  if(overOpsCap || overStyleCap){
    PENDING_CONFIRM = {
      level: overOpsCap ? 'deep' : 'normal',
      title: overOpsCap ? '超出 425 件／日操作參考' : '已達／超過週上限',
      message: overOpsCap
        ? `本週預計件數將達 ${newPieceTotal} 件，超出操作參考上限 ${caps.pieceCapOps} 件。儲存後將自動標記「待 WRD 覆核」。是否確認儲存？`
        : `本週預計款數將達 ${newStyleTotal} 款，較上限 ${caps.styleCap} 款超出 ${Math.max(0,newStyleTotal-caps.styleCap)} 款。是否確認儲存？`,
      onConfirm: ()=>{ doSave(overOpsCap ? 'pending_review' : undefined); PENDING_CONFIRM=null; },
      onCancel: ()=>{ PENDING_CONFIRM=null; render(); }
    };
    render();
    return;
  }
  doSave(overPlanCap ? undefined : undefined);
}

function handleMatrixPaste(event, startInput){
  const values = parsePastedNumbers(event.clipboardData && event.clipboardData.getData('text/plain'));
  if(values.length < 2) return;
  event.preventDefault();
  const brandId = startInput.dataset.brand;
  const rowInputs = [...document.querySelectorAll(`table.matrix input[data-brand="${brandId}"]`)];
  const startIndex = rowInputs.indexOf(startInput);
  if(startIndex < 0) return;
  const targetInputs = rowInputs.slice(startIndex, startIndex + values.length);
  const parsed = values.map(v=>v==='' ? null : Math.max(0, Math.floor(Number(v))));
  if(parsed.some((v,i)=>values[i]!=='' && !Number.isFinite(v))){ alert('Excel 貼上的內容必須全部是非負整數。'); return; }
  const byWeek = {};
  targetInputs.forEach((input, i)=>{
    const w = input.dataset.week;
    byWeek[w] = byWeek[w] || {};
    byWeek[w][input.dataset.field] = parsed[i];
  });
  for(const w of Object.keys(byWeek)){
    const existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===w && f.status!=='cancelled' && !f.itemRef);
    const styles = byWeek[w].styles !== undefined ? byWeek[w].styles : (existing ? existing.styles : null);
    const pieces = byWeek[w].pieces !== undefined ? byWeek[w].pieces : (existing ? existing.pieces : null);
    if(!canEditBrand(brandId) || !canEditForecastCell(brandId, STATE.weeks.find(x=>x.id===w))){ alert('Excel 貼上已取消：此品牌或業務週目前不可修改。'); return; }
    if(invalidForecastPair(styles, pieces)){
      alert('資料不合理：款數不能多於件數。Excel 貼上已取消，請檢查該週的款數／件數。');
      return;
    }
  }
  Object.keys(byWeek).forEach(w=>{
    const existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===w && f.status!=='cancelled' && !f.itemRef);
    const styles = byWeek[w].styles !== undefined ? byWeek[w].styles : (existing ? existing.styles : null);
    const pieces = byWeek[w].pieces !== undefined ? byWeek[w].pieces : (existing ? existing.pieces : null);
    upsertForecast({brandId, weekId:w, itemRef:'', styles, pieces, note:''});
  });
  commitEdit();
}

/* ============================= 完成率趨勢（僅 WRD／系統管理員）============================= */
function renderTrend(){
  const months = [...STATE.months].sort((a,b)=>a.ym.localeCompare(b.ym));
  if(months.length===0) return `<div class="empty">尚未建立規劃月份。</div>`;

  const monthRates = months.map(m=>{
    const f = monthTotals(m), c = monthCompletionTotals(m);
    const rate = f.pieces>0 ? (c.pieces/f.pieces*100) : null;
    return {ym:m.ym, id:m.id, forecast:f, completion:c, rate};
  });
  const maxRate = Math.max(100, ...monthRates.map(r=>r.rate||0));
  const barW = 64, gap = 28, chartH = 220, leftPad = 50, topPad = 20;
  const chartW = leftPad + monthRates.length*(barW+gap);
  const bars = monthRates.map((r,i)=>{
    const x = leftPad + i*(barW+gap);
    const h = r.rate==null ? 0 : Math.round((r.rate/maxRate)*chartH);
    const y = topPad + chartH - h;
    const color = r.rate==null ? '#DAD6CC' : (r.rate<70 ? 'var(--red)' : r.rate<95 ? 'var(--amber)' : 'var(--green)');
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="2"></rect>
      <text x="${x+barW/2}" y="${topPad+chartH+18}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${monthLabel(r.ym).replace('年','/').replace('月','')}</text>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${r.rate==null?'—':r.rate.toFixed(0)+'%'}</text>
    `;
  }).join('');
  const refY100 = topPad + chartH - Math.round((100/maxRate)*chartH);

  const svg = `
    <svg viewBox="0 0 ${chartW+20} ${topPad+chartH+40}" style="width:100%;max-width:760px;height:auto;font-family:'IBM Plex Mono',monospace;">

function weekHasRealData(weekId){
  return STATE.forecasts.some(f=>f.weekId===weekId && f.status!=='cancelled');
}
function regenerateEmptyFutureWeeks(){
  const eligibleMonths = STATE.months.filter(m=>{
    const weeksOfMonth = STATE.weeks.filter(w=>w.monthId===m.id);
    return weeksOfMonth.length===0 || weeksOfMonth.every(w=>!weekHasRealData(w.id));
  });
  if(eligibleMonths.length===0) return {changed:[], skipped: STATE.months.map(m=>m.ym)};
  eligibleMonths.sort((a,b)=>a.ym.localeCompare(b.ym));
  // 把連續（相鄰）的合格月份分組，各組各自產生一段連續的週六至週五週期
  const groups = [];
  let current = [eligibleMonths[0]];
  for(let i=1;i<eligibleMonths.length;i++){
    const prevYm = current[current.length-1].ym;
    const [py,pm] = prevYm.split('-').map(Number);
    const expectedNext = (pm===12) ? (py+1)+'-01' : py+'-'+pad(pm+1);
    if(eligibleMonths[i].ym===expectedNext){ current.push(eligibleMonths[i]); }
    else { groups.push(current); current=[eligibleMonths[i]]; }
  }
  groups.push(current);

  groups.forEach(group=>{
    // 移除這些月份現有（無資料）的舊業務週
    const monthIds = new Set(group.map(m=>m.id));
    STATE.weeks = STATE.weeks.filter(w=>!monthIds.has(w.monthId));
    const monthMeta = group.map(m=>{
      const [y,mm] = m.ym.split('-').map(Number);
      return {id:m.id, ym:m.ym, start:new Date(y,mm-1,1), end:new Date(y,mm,0)};
    });
    const rangeStart = monthMeta[0].start;
    const rangeEnd = monthMeta[monthMeta.length-1].end;
    let weekStart = new Date(rangeStart);
    while(weekStart.getDay() !== 6){ weekStart = addDays(weekStart, -1); }
    while(weekStart <= rangeEnd){
      const weekEnd = addDays(weekStart, 6);
      const clipStart = weekStart < rangeStart ? rangeStart : weekStart;
      const clipEnd = weekEnd > rangeEnd ? rangeEnd : weekEnd;
      if(clipStart <= clipEnd){
        const owner = ownerMonthByMajority(clipStart, clipEnd, monthMeta) || monthMeta[0];
        const days = Math.min(MAX_WORKDAYS_PER_WEEK, Math.round((clipEnd - clipStart) / 86400000) + 1);
        STATE.weeks.push({
          id: uid('week'), monthId: owner.id, startDate: fmtDate(clipStart), endDate: fmtDate(clipEnd),
          workdays: days, styleCapOverride:null, pieceCapPlanOverride:null, pieceCapOpsOverride:null,
          overrideReason:'', overrideBy:'', overrideAt:''
        });
      }
      weekStart = addDays(weekStart, 7);
    }
  });

  const changed = eligibleMonths.map(m=>m.ym);
  const skipped = STATE.months.filter(m=>!changed.includes(m.ym)).map(m=>m.ym);
  return {changed, skipped};
}

      const m = STATE.months.find(x=>x.id===inp.dataset.monthcapoverride);
      const raw = inp.value.trim();
      if(raw===''){ m.pieceCapOverride=null; m.overrideReason=''; m.overrideBy=''; m.overrideAt=''; persist().then(render); return; }
      const reason = prompt('請輸入覆寫原因：');
      if(reason===null){ render(); return; }
      m.pieceCapOverride = Math.max(0, parseInt(raw,10)||0);
      m.overrideReason = reason; m.overrideBy = currentUser(); m.overrideAt = nowStr();
      persist().then(render);
    };
  });
}
function bindOverrideInput(dataAttr, field){
  document.querySelectorAll('[data-'+dataAttr+']').forEach(inp=>{
    inp.onchange = ()=>{
      const w = STATE.weeks.find(x=>x.id===inp.dataset[toCamel(dataAttr)]);
      const raw = inp.value.trim();
      if(raw===''){ w[field]=null; persist().then(render); return; }
      const reason = prompt('請輸入覆寫原因：');
      if(reason===null){ render(); return; }
      w[field] = Math.max(0, parseInt(raw,10)||0);
      w.overrideReason = reason; w.overrideBy = currentUser(); w.overrideAt = nowStr();
      persist().then(render);
    };
  });
}
function toCamel(s){ return s.replace(/-([a-z])/g,(m,c)=>c.toUpperCase()); }

/* ============================= 客戶／品牌管理 ============================= */
function renderBrands(){
  const rows = STATE.brands.map(b=>`
    <tr>
      <td><input type="text" data-brandname="${b.id}" value="${b.name}"></td>
      <td><span class="badge" style="background:${b.active?'var(--green-soft)':'var(--red-soft)'};color:${b.active?'var(--green)':'var(--red)'};">${b.active?'啟用中':'已停用'}</span></td>
      <td><button class="btn secondary btn-sm" data-togglebrand="${b.id}">${b.active?'停用':'重新啟用'}</button></td>
    </tr>
  `).join('');
  return `
    <h1 class="page-title">客戶／品牌管理</h1>
    <p class="page-sub">維護受控品牌清單。一般同事在所有輸入畫面僅能由此清單選擇，不可自由輸入品牌名稱。</p>
    <div class="panel">
      <h2>新增品牌</h2>
      <div class="field-row">
        <div class="field"><label>品牌／客戶名稱</label><input type="text" id="newBrandName" style="min-width:220px;"></div>
        <button class="btn" id="addBrandBtn">新增</button>

function bindBrands(){
  const addBtn = document.getElementById('addBrandBtn');
  if(addBtn) addBtn.onclick = ()=>{
    const name = document.getElementById('newBrandName').value.trim();
    if(!name){ alert('請輸入名稱'); return; }
    if(STATE.brands.find(b=>b.name.toLowerCase()===name.toLowerCase())){ alert('此名稱已存在，請改用合併或啟用既有項目'); return; }
    STATE.brands.push({id:uid('brand'), name, active:true});
    persist().then(render);
  };
  document.querySelectorAll('[data-togglebrand]').forEach(b=>{
    b.onclick = ()=>{
      const brand = STATE.brands.find(x=>x.id===b.dataset.togglebrand);
      const action = brand.active ? '停用' : '重新啟用';
      if(!confirm(`確定要${action}品牌「${brand.name}」嗎？`)) return;
      brand.active = !brand.active;
      persist().then(render);
    };
  });
  document.querySelectorAll('[data-brandname]').forEach(inp=>{
    inp.onchange = ()=>{
      const brand = STATE.brands.find(x=>x.id===inp.dataset.brandname);
      const v = inp.value.trim();
      if(v) brand.name = v;
      persist().then(render);
    };
  });
}

/* ============================= 歷史預計數 vs 完成數分析（只用現有 STATE） ============================= */
function historicalAnalysis(monthId,query){
 const ms=historicalMonths([...STATE.months].sort((a,b)=>a.ym.localeCompare(b.ym))), ids=new Set(monthId?[monthId]:ms.map(m=>m.id)), wids=new Set(STATE.weeks.filter(w=>ids.has(w.monthId)).map(w=>w.id));
 return STATE.brands.filter(b=>b.active&&(!query||b.name.toLowerCase().includes(query.toLowerCase()))).map(b=>{const fs=STATE.forecasts.filter(f=>f.brandId===b.id&&wids.has(f.weekId)&&f.status!=='cancelled'&&!f.itemRef),cs=STATE.completions.filter(c=>c.brandId===b.id&&wids.has(c.weekId)&&c.status!=='cancelled'&&!c.itemRef),fp=fs.reduce((n,x)=>n+(x.pieces||0),0),cp=cs.reduce((n,x)=>n+(x.pieces||0),0);return {brand:b.name,fs:fs.length,cs:cs.length,fp,cp,rate:fp?cp/fp*100:null};}).filter(x=>x.fs||x.cs).sort((a,b)=>(a.rate??-1)-(b.rate??-1));
}
function historicalAnalysisHtml(){const months=historicalMonths([...STATE.months].sort((a,b)=>a.ym.localeCompare(b.ym))),rows=historicalAnalysis(VIEW.analysisMonthId,VIEW.analysisQuery||''),tf=rows.reduce((n,r)=>n+r.fp,0),tc=rows.reduce((n,r)=>n+r.cp,0),max=Math.max(1,...rows.map(r=>Math.max(r.fp,r.cp))),chart=rows.slice(0,12).map(r=>`<div class="chart-row"><span>${r.brand}</span><div class="chart-track"><div class="chart-forecast" style="width:${Math.round(r.fp/max*100)}%"></div><div class="chart-completion" style="width:${Math.round(r.cp/max*100)}%"></div></div><span>${r.rate==null?'資料不足':r.rate.toFixed(1)+'%'}</span></div>`).join(''),table=rows.map(r=>`<tr><td>${r.brand}</td><td class="num">${r.fp.toLocaleString()}</td><td class="num">${r.cp.toLocaleString()}</td><td class="num">${(r.cp-r.fp).toLocaleString()}</td><td class="num">${r.rate==null?'資料不足':r.rate.toFixed(1)+'%'}</td><td class="num">${r.fs}/${r.cs}</td></tr>`).join('');return `<div class="analysis-summary"><div class="analysis-card"><div class="label">歷史預計件數</div><div class="value">${tf.toLocaleString()}</div></div><div class="analysis-card"><div class="label">歷史完成件數</div><div class="value">${tc.toLocaleString()}</div></div><div class="analysis-card"><div class="label">整體達成率</div><div class="value">${tf?(tc/tf*100).toFixed(1)+'%':'—'}</div></div><div class="analysis-card"><div class="label">分析品牌數</div><div class="value">${rows.length}</div></div></div><div class="chart-legend"><span><i style="background:var(--accent)"></i>預計</span><span><i style="background:var(--green)"></i>完成</span></div><div class="analysis-chart">${chart||'<div class="empty">沒有可分析的歷史資料</div>'}</div><table class="plain"><thead><tr><th>品牌</th><th>預計件數</th><th>完成件數</th><th>差異</th><th>達成率</th><th>週數（預計／完成）</th></tr></thead><tbody>${table||'<tr><td colspan="6" class="empty">沒有可分析的歷史資料</td></tr>'}</tbody></table>`;}

/* ============================= 匯出 ============================= */
function renderExport(){
  const months = [...STATE.months].sort((a,b)=>a.ym.localeCompare(b.ym));
  const options = months.map(m=>`<option value="${m.id}">${monthLabel(m.ym)}</option>`).join('');
  return `
    <h1 class="page-title">匯出</h1>
    <p class="page-sub">匯出目前篩選範圍內的逐筆資料，供會議、追溯與離線分析使用。</p>
    <div class="panel">
      <h2>逐筆資料匯出</h2>
      <div class="field-row">
        <div class="field"><label>資料類型</label>
          <select id="exportType">
            <option value="forecast">預測數</option>
            <option value="completion">完成數</option>
          </select>
        </div>
        <div class="field"><label>選擇月份</label><select id="exportMonth"><option value="">全部月份</option>${options}</select></div>
        <button class="btn secondary" id="exportBtn">匯出 CSV</button>
        <button class="btn secondary" id="exportXlsxBtn">匯出 Excel（.xlsx）</button>
      </div>
      <p class="footnote">匯出內容包含客戶／品牌、業務週、款數、件數、狀態、建立與修改人員及時間，與畫面篩選範圍一致。</p>
    </div>
    <div class="panel">
      <h2>完整備份（JSON）</h2>
      <p class="footnote">JSON 適合完整還原；Excel 適合閱讀、會議及離線分析。兩者都包含月份、業務週、客戶、預測數及完成數。建議定期下載備份。</p>
      <div class="field-row">
        <button class="btn secondary" id="exportBackupBtn">匯出完整備份（JSON）</button><button class="btn secondary" id="exportFullXlsxBtn">匯出完整備份（Excel）</button>
      </div>
    </div>
    <div class="panel">
      <h2>歷史預計數 vs 完成數品牌分析</h2><p class="footnote">只統計已過去月份，不包括本月或未來月份；未填完成數不會被當成完成 0。</p>
      <div class="field-row"><div class="field"><label>歷史月份</label><select id="analysisMonth"><option value="">所有歷史月份</option>${historicalMonths(months).map(m=>`<option value="${m.id}" ${VIEW.analysisMonthId===m.id?'selected':''}>${monthLabel(m.ym)}</option>`).join('')}</select></div><div class="field"><label>品牌搜尋</label><input id="analysisBrand" value="${VIEW.analysisQuery||''}" placeholder="可留空"></div><button class="btn secondary" id="refreshAnalysisBtn">更新分析</button></div><div id="historicalAnalysisBody">${historicalAnalysisHtml()}</div>
    </div>
    <div class="panel" style="border-color:var(--red);">
      <h2 style="color:var(--red);">還原備份</h2>
      <p class="footnote">上傳先前匯出的完整備份 JSON 檔案，將會<strong>完全覆蓋</strong>目前系統上的所有資料。此操作不可復原，請謹慎使用。</p>
      <div class="field-row">
        <input type="file" id="restoreFileInput" accept="application/json">
        <button class="btn danger" id="restoreBackupBtn">還原此備份</button>
      </div>
    </div>
    <div class="panel" style="border-color:var(--red);">
      <h2 style="color:var(--red);">從雲端自動備份還原</h2>
      <p class="footnote">系統每日第一次載入時，會自動把當時的雲端資料存成當日備份（目前沿用原有 Firebase 路徑）。如資料被誤刪或覆蓋，可選擇日期還原到該日最早的狀態（會完全覆蓋目前資料，不可復原）。</p>
      <div class="field-row">
        <div class="field"><label>備份日期</label><select id="cloudBackupDate">${cloudBackupDateOptions()}</select></div>
        <button class="btn danger" id="restoreCloudBackupBtn">還原此日備份</button>
      </div>
    </div>
  `;
}
function cloudBackupDateOptions(){
  const opts=[]; const d=new Date();
  for(let i=0;i<14;i++){
    const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    opts.push(`<option value="${k}">${k}${i===0?'（今日）':''}</option>`);
    d.setDate(d.getDate()-1);
  }
  return opts.join('');
}
function bindExport(){
  const monthIdFor = ()=> document.getElementById('exportMonth').value;
  const typeFor = ()=> document.getElementById('exportType').value;

  function filteredRecords(){
    const type = typeFor();
    const source = type==='completion' ? STATE.completions : STATE.forecasts;
    let rs = source.filter(f=>f.status!=='cancelled');
    const monthId = monthIdFor();
    if(monthId){
      const weekIds = new Set(STATE.weeks.filter(w=>w.monthId===monthId).map(w=>w.id));
      rs = rs.filter(f=>weekIds.has(f.weekId));
    }
    return {type, rs};
  }
  function toRows(type, rs){
    const rows = [['客戶／品牌','業務週起','業務週迄','規劃月份','項目參考','款數','件數','狀態','備註','建立人','建立時間','最後修改人','最後修改時間']];
    rs.forEach(f=>{
      const week = STATE.weeks.find(w=>w.id===f.weekId);
      const month = week? STATE.months.find(m=>m.id===week.monthId) : null;
      rows.push([brandName(f.brandId), week?week.startDate:'', week?week.endDate:'', month?monthLabel(month.ym):'',
        f.itemRef||'', f.styles, f.pieces, statusLabel(f.status), f.note||'', f.createdBy, f.createdAt, f.modifiedBy, f.modifiedAt]);
    });
    return rows;
  }

  const refreshAnalysisBtn=document.getElementById('refreshAnalysisBtn');
  if(refreshAnalysisBtn) refreshAnalysisBtn.onclick=()=>{VIEW.analysisMonthId=document.getElementById('analysisMonth').value;VIEW.analysisQuery=document.getElementById('analysisBrand').value.trim();const body=document.getElementById('historicalAnalysisBody');if(body)body.innerHTML=historicalAnalysisHtml();};

  const btn = document.getElementById('exportBtn');
  if(btn) btn.onclick = ()=>{
    const {type, rs} = filteredRecords();
    downloadCsv('WSPS_'+(type==='completion'?'completion':'forecast')+'_export_'+fmtDate(new Date())+'.csv', toRows(type, rs));
  };

  const xlsxBtn = document.getElementById('exportXlsxBtn');
  if(xlsxBtn) xlsxBtn.onclick = ()=>{
    if(typeof XLSX === 'undefined'){ alert('Excel 匯出元件載入失敗，請檢查網路連線後重試，或改用 CSV 匯出。'); return; }
    const {type, rs} = filteredRecords();
    const rows = toRows(type, rs);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, type==='completion'?'完成數':'預測數');
    XLSX.writeFile(wb, 'WSPS_'+(type==='completion'?'completion':'forecast')+'_export_'+fmtDate(new Date())+'.xlsx');
  };

  const backupBtn = document.getElementById('exportBackupBtn');
  if(backupBtn) backupBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'WSPS_backup_'+fmtDate(new Date())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const fullXlsxBtn = document.getElementById('exportFullXlsxBtn');
  if(fullXlsxBtn) fullXlsxBtn.onclick = ()=>{
    if(typeof XLSX === 'undefined'){ alert('Excel 匯出元件載入失敗，請檢查網路連線後重試。'); return; }
    const workbook = XLSX.utils.book_new();
    const monthRows = [['月份','件數上限','款數上限','覆寫原因','覆寫人','覆寫時間']];
    STATE.months.slice().sort((a,b)=>a.ym.localeCompare(b.ym)).forEach(m=>{
      const caps = monthCaps(m);
      monthRows.push([monthLabel(m.ym), caps.pieceCap, caps.styleCap, m.overrideReason||'', m.overrideBy||'', m.overrideAt||'']);
    });
    const weekRows = [['業務週起','業務週迄','規劃月份','工作日','款數上限','件數規劃上限','件數操作上限']];
    STATE.weeks.slice().sort((a,b)=>a.startDate.localeCompare(b.startDate)).forEach(w=>{
      const c=weekCaps(w), m=STATE.months.find(x=>x.id===w.monthId);
      weekRows.push([w.startDate,w.endDate,m?monthLabel(m.ym):'',w.workdays,c.styleCap,c.pieceCapPlan,c.pieceCapOps]);
    });
    const brandRows = [['品牌','狀態']].concat(STATE.brands.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>[b.name,b.active?'啟用':'停用']));
    const recordRows = type=>{
      const source=type==='completion'?STATE.completions:STATE.forecasts;
      const rows=[['客戶／品牌','業務週起','業務週迄','規劃月份','項目參考','款數','件數','狀態','備註','建立人','建立時間','最後修改人','最後修改時間']];
      source.filter(f=>f.status!=='cancelled').forEach(f=>{const w=STATE.weeks.find(x=>x.id===f.weekId),m=w&&STATE.months.find(x=>x.id===w.monthId);rows.push([brandName(f.brandId),w?w.startDate:'',w?w.endDate:'',m?monthLabel(m.ym):'',f.itemRef||'',f.styles,f.pieces,statusLabel(f.status),f.note||'',f.createdBy,f.createdAt,f.modifiedBy,f.modifiedAt]);});
      return rows;
    };
    [['月份',monthRows],['業務週',weekRows],['品牌',brandRows],['預測數',recordRows('forecast')],['完成數',recordRows('completion')]].forEach(([name,rows])=>XLSX.utils.book_append_sheet(workbook,XLSX.utils.aoa_to_sheet(rows),name));
    XLSX.writeFile(workbook,'WSPS_full_backup_'+fmtDate(new Date())+'.xlsx');
  };

  const cloudRestoreBtn = document.getElementById('restoreCloudBackupBtn');
  if(cloudRestoreBtn) cloudRestoreBtn.onclick = async ()=>{
    const key = document.getElementById('cloudBackupDate').value;
    if(!window.firebaseGetBackup){ alert('目前未連接雲端資料庫，無法讀取備份。'); return; }
    let value;
    try{ value = await window.firebaseGetBackup(key); }catch(e){ alert('讀取備份失敗：'+e.message); return; }
    if(!value){ alert(key+' 沒有備份（系統只會在有人載入網站的當日建立備份）。'); return; }
    if(!confirm('確定要用 '+key+' 的備份完全覆蓋目前所有資料嗎？此操作不可復原。')) return;
    try{
      const parsed = JSON.parse(value);
      STATE = Object.assign({brands:[],months:[],weeks:[],forecasts:[],completions:[]}, parsed);
      persist({overwrite:true}).then(()=>{ render(); alert('已還原 '+key+' 的備份。'); });
    }catch(e){ alert('備份內容損毀：'+e.message); }
  };

  const restoreBtn = document.getElementById('restoreBackupBtn');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    const input = document.getElementById('restoreFileInput');
    const file = input.files && input.files[0];
    if(!file){ alert('請先選擇備份檔案'); return; }
    if(!confirm('確定要用此備份完全覆蓋目前系統上的所有資料嗎？此操作不可復原。')) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed || !Array.isArray(parsed.brands) || !Array.isArray(parsed.months) || !Array.isArray(parsed.weeks)){
          alert('檔案格式不正確，無法還原。'); return;
        }
        STATE = Object.assign({brands:[],months:[],weeks:[],forecasts:[],completions:[]}, parsed);
        persist({overwrite:true}).then(()=>{ render(); alert('已成功還原備份。'); });
      }catch(err){
        alert('讀取備份檔案失敗：'+err.message);
      }
    };
    reader.readAsText(file);
  };
}

/* ============================= 啟動 ============================= */
(async function init(){
  render();
  if(!HAS_CLOUD_STORAGE){
    await new Promise(resolve => {
      if(window.firebaseGetData || window.firebaseError) return resolve();
      window.addEventListener('firebase-ready', resolve, {once:true});
      setTimeout(resolve, 5000);
    });
    USING_FIREBASE = !!window.firebaseGetData && !window.firebaseError;
    if(!USING_FIREBASE){
      CLOUD_ERROR = window.firebaseError || new Error('WSPS 共用資料庫未連線。');
      const hint = document.getElementById('saveHint');
      if(hint){ hint.textContent = '未連線：目前不可同步'; hint.classList.add('show'); }
    }
  }
  await loadState();
  render();
})();
</script>
