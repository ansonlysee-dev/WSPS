<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WSPS — Washing Sample Projection System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEECE6;
    --panel:#FFFFFF;
    --line:#D9D5C9;
    --ink:#1E1B16;
    --ink-soft:#6B6659;
    --accent:#2F4665;
    --accent-soft:#DDE4EC;
    --amber:#B8791E;
    --amber-soft:#F6E9D3;
    --red:#A73B2E;
    --red-soft:#F5DEDA;
    --deep-red:#6E2018;
    --deep-red-soft:#EBD1CC;
    --green:#3F6B4B;
    --green-soft:#DEEBE2;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .num, table td.num, input.num{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:var(--accent);}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  ::selection{background:var(--accent-soft);}

  /* ---- shell ---- */
  .app{max-width:1320px;margin:0 auto;padding:0 24px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:28px 0 18px;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:16px;
  }
  .brandmark{display:flex;flex-direction:column;gap:2px;}
  .brandmark .zh{font-size:22px;font-weight:700;letter-spacing:0.02em;}
  .brandmark .en{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:0.08em;}
  .identity{display:flex;gap:10px;align-items:center;}
  .identity input, .identity select{
    font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);
    background:var(--panel);border-radius:var(--radius);color:var(--ink);
  }
  .identity label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .identity .field{display:flex;flex-direction:column;}

  nav.tabs{
    display:flex;gap:2px;margin:18px 0 22px;border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;padding:10px 16px;font-size:13.5px;
    color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;}
  nav.tabs button:hover{color:var(--ink);}

  h1.page-title{font-size:19px;margin:0 0 4px;font-weight:700;}
  p.page-sub{color:var(--ink-soft);margin:0 0 20px;font-size:13px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .panel h2{font-size:14.5px;margin:0 0 12px;font-weight:600;}

  /* ---- overview month cards ---- */
  .month-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
  .month-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:14px 16px;position:relative;}
  .month-card .mlabel{font-weight:700;font-size:14px;margin-bottom:10px;}
  .month-card .metric-row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;color:var(--ink-soft);}
  .month-card .metric-row .v{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .bar-track{height:6px;background:#EDEBE4;border-radius:2px;overflow:hidden;margin:6px 0 8px;}
  .bar-fill{height:100%;background:var(--accent);}
  .bar-fill.warn{background:var(--amber);}
  .bar-fill.alert{background:var(--red);}
  .bar-fill.deep{background:var(--deep-red);}
  .status-chip{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:600;
    letter-spacing:0.01em;
  }
  .status-chip.normal{background:var(--green-soft);color:var(--green);}
  .status-chip.near{background:var(--amber-soft);color:var(--amber);}
  .status-chip.at{background:var(--red-soft);color:var(--red);}
  .status-chip.over{background:var(--deep-red-soft);color:var(--deep-red);}

  /* ---- matrix table ---- */
  .matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
  table.matrix{border-collapse:collapse;width:100%;min-width:900px;}
  table.matrix th, table.matrix td{border:1px solid var(--line);padding:0;font-size:12.5px;}
  table.matrix thead th{
    background:var(--ink);color:#fff;padding:8px 10px;text-align:center;position:sticky;top:0;z-index:2;
    font-weight:600;
  }
  table.matrix thead th.brandcol{text-align:left;position:sticky;left:0;z-index:3;}
  table.matrix tbody td.brandcol{
    position:sticky;left:0;background:var(--panel);font-weight:600;padding:9px 12px;z-index:1;
    border-right:2px solid var(--line);white-space:nowrap;
  }
  table.matrix tbody tr:nth-child(even) td.brandcol{background:#FAF9F5;}
  .cellwrap{padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:104px;}
  .cellwrap .pair{display:flex;gap:4px;align-items:center;}
  .cellwrap input{
    width:46px;font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);
    border-radius:2px;padding:3px 4px;text-align:right;
  }
  .cellwrap input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .cellwrap .tag{font-size:9.5px;color:var(--ink-soft);width:14px;}
  .cellwrap.blank{color:#BEB9AC;}
  .rowtotal{padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;background:#FAF9F5;}
  .weekfoot td{padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#F5F3EC;text-align:center;}
  .weekfoot td.brandcol{background:#F5F3EC;}

  /* ---- generic table ---- */
  table.plain{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.plain th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);font-weight:600;font-size:12px;color:var(--ink-soft);}
  table.plain td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.plain tr:hover td{background:#FAF9F5;}

  .btn{
    border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 14px;border-radius:var(--radius);
    font-size:12.5px;font-weight:600;
  }
  .btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line);}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:4px 10px;font-size:11.5px;}

  .field-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}
  .field input, .field select{
    font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);
    min-width:120px;
  }

  .badge{font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .muted{color:var(--ink-soft);}
  .warn-banner{
    display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--radius);
    font-size:12.5px;margin-bottom:14px;border:1px solid transparent;
  }
  .warn-banner.near{background:var(--amber-soft);border-color:var(--amber);color:#7A521A;}
  .warn-banner.at{background:var(--red-soft);border-color:var(--red);color:#7A2A20;}
  .warn-banner.over{background:var(--deep-red-soft);border-color:var(--deep-red);color:var(--deep-red);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,18,14,0.55);display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:440px;width:92%;border-top:4px solid var(--red);}
  .modal.deep{border-top-color:var(--deep-red);}
  .modal h3{margin:0 0 10px;font-size:15px;}
  .modal p{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .footnote{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .role-gate{padding:40px;text-align:center;color:var(--ink-soft);}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 12px;font-size:12px;}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .save-hint{position:fixed;bottom:16px;right:16px;background:var(--ink);color:#fff;padding:8px 14px;
    border-radius:var(--radius);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;}
  .save-hint.show{opacity:0.92;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:800px){.grid2{grid-template-columns:1fr;}}
  .audit{font-size:11px;color:var(--ink-soft);}
  select.status-select{font-size:11.5px;}
</style>

<script>
/* ============================= 常數與預設值 ============================= */
const STYLE_PER_DAY = 85;
const PIECES_PLAN_PER_DAY = 400;
const PIECES_OPS_PER_DAY = 425;
const MONTH_PIECE_CAP_DEFAULT = 10000;
const AVG_PIECES_PER_STYLE = 5;

const GROUPS = {
  BO: 'BO',
  WRD: 'WRD'
};
const SYSTEM_ADMIN_NAME = 'Anson Tse'; // 系統管理人身份僅此人可勾選

const SEED_BRANDS = ["Levis Women","Levis Men","Quetico","AEO Women","AEO Men","Adidas","Levis China","UQ","ANF","Target","CAL-PD","PPC"];

/* ============================= 小工具 ============================= */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function monthLabel(ym){ const [y,m]=ym.split('-'); return y+'年'+parseInt(m,10)+'月'; }
function nowStr(){ const d=new Date(); return fmtDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function escapeCsv(v){ if(v==null) return ''; const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(escapeCsv).join(',')).join('\r\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ============================= 狀態 ============================= */
let STATE = {
  brands: [],
  months: [],   // {id, ym:'2026-09', label, pieceCapOverride, overrideReason, overrideBy, overrideAt}
  weeks: [],    // {id, monthId, startDate, endDate, workdays, styleCapOverride, pieceCapPlanOverride, pieceCapOpsOverride, overrideReason, overrideBy, overrideAt}
  forecasts: [] // {id, brandId, weekId, itemRef, styles, pieces, note, status, createdBy, createdAt, modifiedBy, modifiedAt, history:[]}
};
let LOADED = false;
let SAVING = false;

let SESSION = {
  userName: '',
  group: 'BO',          // 只分兩組：'WRD' 或 'BO'
  isSystemAdmin: false  // 系統管理員身份，僅姓名為 Anson Tse 時可勾選
};

function isPrivileged(){ // WRD 組或系統管理員 → 可見全部逐筆資料、可管理設定、可修改他人資料
  return SESSION.group === 'WRD' || SESSION.isSystemAdmin;
}
function identityLabel(){
  if(SESSION.isSystemAdmin) return '系統管理員';
  return SESSION.group === 'WRD' ? 'WRD' : 'BO';
}
function isSystemAdminEligible(name){
  return (name||'').trim() === SYSTEM_ADMIN_NAME;
}
function validateNameNoInnerSpace(name){
  const trimmed = (name||'').trim();
  return trimmed.length>0 && !/\s/.test(trimmed); // 去除頭尾空白後，中間不可再有任何空白字元
}

let VIEW = { tab: 'overview', matrixMonthId: null, weeklyDetailWeekId: null, exportMonthId: null };
let PENDING_CONFIRM = null; // for over-cap confirm modal

/* ============================= 儲存層 ============================= */
/* 外部部署必須使用 Firebase；不再靜默退回 localStorage，避免同事誤以為資料已同步。 */
const STORAGE_KEY = 'wsps:data';
const HAS_CLOUD_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
let USING_FIREBASE = false;
let USING_LOCAL_FALLBACK = false;
let CLOUD_ERROR = null;
function requireSharedStorage(){ if(!HAS_CLOUD_STORAGE && !USING_FIREBASE) throw new Error('WSPS 共用資料庫未連線，資料未同步。'); }
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error((label||'操作')+'逾時（超過 '+(ms/1000)+' 秒無回應），請檢查 Firestore 是否為 Native mode、網路是否被封鎖。')), ms))
  ]);
}
async function storageGet(){
  if(HAS_CLOUD_STORAGE) return await window.storage.get(STORAGE_KEY, true);
  requireSharedStorage();
  const value = await withTimeout(window.firebaseGetData(), 6000, '讀取雲端資料');
  return value ? {value} : null;
}
async function storageSet(valueStr){
  if(HAS_CLOUD_STORAGE) return await window.storage.set(STORAGE_KEY, valueStr, true);
  requireSharedStorage();
  await withTimeout(window.firebaseSetData(valueStr), 6000, '寫入雲端資料');
  return {value: valueStr};
}

async function loadState(){
  try{
    const r = await storageGet();
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      STATE = Object.assign({brands:[],months:[],weeks:[],forecasts:[]}, parsed);
    } else {
      seedInitialData();
    }
  }catch(e){
    seedInitialData();
  }
  runHistoricalImportMigration();
  await persist();
  LOADED = true;
  if(USING_FIREBASE && window.firebaseListen){
    window.firebaseListen((valueStr)=>{
      if(SAVING) return;
      try{
        const parsed = JSON.parse(valueStr);
        STATE = Object.assign({brands:[],months:[],weeks:[],forecasts:[]}, parsed);
        render();
      }catch(e){ console.error('同步資料格式錯誤', e); }
    });
  }
}

async function persist(){
  let succeeded = false;
  try{
    SAVING = true;
    CLOUD_ERROR = null;
    await storageSet(JSON.stringify(STATE));
    succeeded = true;
  }catch(e){
    CLOUD_ERROR = e;
    console.error('儲存失敗', e);
  }finally{
    SAVING = false;
    const hint = document.getElementById('saveHint');
    if(hint){
      hint.textContent = succeeded ? '已同步' : '未同步：共用資料庫未連線';
      hint.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>hint.classList.remove('show'), 2200);
    }
  }
}
let saveTimer=null;
function flashSaved(){
  const el = document.getElementById('saveHint');
  if(!el) return;
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>el.classList.remove('show'), 900);
}

function seedInitialData(){
  STATE.brands = SEED_BRANDS.map(name=>({id:uid('brand'), name, active:true}));
  // 業務週採「週五至週二」為一週期（非 1-6 或週一至週五），未來 6 個月自動產生預設週別
  const today = new Date();
  for(let i=0;i<6;i++){
    const md = new Date(today.getFullYear(), today.getMonth()+i, 1);
    const ym = md.getFullYear()+'-'+pad(md.getMonth()+1);
    const monthId = uid('month');
    STATE.months.push({id:monthId, ym, pieceCapOverride:null, overrideReason:'', overrideBy:'', overrideAt:''});
    const monthStart = new Date(md.getFullYear(), md.getMonth(), 1);
    const monthEnd = new Date(md.getFullYear(), md.getMonth()+1, 0);
    // 找到當月 1 號當週或之前最近的週五，作為第一個業務週的起點
    let weekStart = new Date(monthStart);
    while(weekStart.getDay() !== 5){ weekStart = addDays(weekStart, -1); }
    while(weekStart <= monthEnd){
      const weekEnd = addDays(weekStart, 4); // 週五至週二，共 5 個日曆日
      const clipStart = weekStart < monthStart ? monthStart : weekStart;
      const clipEnd = weekEnd > monthEnd ? monthEnd : weekEnd;
      if(clipStart <= clipEnd){
        const days = Math.round((clipEnd - clipStart) / 86400000) + 1; // 以週期內實際日曆日數作為工作日數，不以 1-6 或週一至週五篩選
        STATE.weeks.push({
          id: uid('week'), monthId, startDate: fmtDate(clipStart), endDate: fmtDate(clipEnd),
          workdays: days, styleCapOverride:null, pieceCapPlanOverride:null, pieceCapOpsOverride:null,
          overrideReason:'', overrideBy:'', overrideAt:''
        });
      }
      weekStart = addDays(weekStart, 7);
    }
  }
}

/* ============================= 歷史資料匯入（來源：Washing_sample_projection_system.xlsx）=============================
   已確認變更：原規劃（文件 10.7）暫不匯入 2026 年 8–10 月歷史資料，經使用者明確指示後改為匯入。
   範圍已縮小為使用者確認的內容：僅匯入每月「款數、件數」總計，逐客戶對照，不匯入完成數、
   準確率，亦不拆分至各業務週（以一個涵蓋全月的區間代表該月合計）。10 月份 Excel 內容全部為 0
   （尚未規劃），故不匯入。此匯入邏輯具冪等性（_historicalImportV1 旗標），不會重複寫入。 */

const HISTORICAL_INACTIVE_BRANDS = ["Joeone","M&S","Tom Tailor"]; // Excel 備註「已不做此客」
const HISTORICAL_MONTHLY = {
  "2026-08": {
    "Levis Women":[285,2884],"Levis Men":[21,78],"Quetico":[13,120],"AEO Women":[2,4],"Bestseller":[4,8],
    "Zara":[28,62],"Adidas":[80,215],"Kontoor":[0,0],"CAL-PD(Mathew Wong Team)":[44,135],"PPC-Paul组客户":[4,120],
    "Levis China":[201,1140],"Joeone":[0,0],"UQ":[83,325],"ANF":[98,351],"AEO Men":[61,232],"GAP":[39,104],
    "ON":[1,5],"Banana Republic":[26,77],"M&S":[0,0],"Tom Tailor":[0,0],"Target":[270,649],
    "CAL-PD(Emily Tsoi Team)":[43,88],"PPC-Jonie组客户":[13,116],"Other":[0,0]
  },
  "2026-09": {
    "Levis Women":[31,1480],"Levis Men":[8,26],"Quetico":[6,12],"AEO Women":[2,12],"Bestseller":[0,0],
    "Zara":[0,0],"Adidas":[21,77],"Kontoor":[0,0],"CAL-PD(Mathew Wong Team)":[38,146],"PPC-Paul组客户":[5,166],
    "Levis China":[127,490],"Joeone":[0,0],"UQ":[115,305],"ANF":[125,456],"AEO Men":[88,275],"GAP":[32,210],

    "CAL-PD(Emily Tsoi Team)":[45,100],"PPC-Jonie组客户":[0,0],"Other":[0,0]
  }
};
function monthWorkdays(ym){
  const [y,m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  let wd = 0;
  for(let d=1; d<=last; d++){ const dow = new Date(y, m-1, d).getDay(); if(dow>=1 && dow<=5) wd++; }
  return wd;
}
function monthRange(ym){
  const [y,m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return { start: y+'-'+pad(m)+'-01', end: y+'-'+pad(m)+'-'+pad(last) };
}
function runHistoricalImportMigration(){
  if(STATE._historicalImportV1) return;

  HISTORICAL_BRANDS.forEach(name=>{
    let b = STATE.brands.find(x=>x.name===name);
    if(!b){
      b = {id:uid('brand'), name, active: !HISTORICAL_INACTIVE_BRANDS.includes(name)};
      STATE.brands.push(b);
    } else if(HISTORICAL_INACTIVE_BRANDS.includes(name)){
      b.active = false;
    }
  });
  // 舊版預設種子資料中籠統的「CAL-PD」「PPC」與 Excel 實際分組名稱不符，停用避免混淆
  ["CAL-PD","PPC"].forEach(name=>{
    const b = STATE.brands.find(x=>x.name===name);
    if(b) b.active = false;
  });

  Object.keys(HISTORICAL_MONTHLY).forEach(ym=>{
    let month = STATE.months.find(m=>m.ym===ym);
    if(!month){
      month = {id:uid('month'), ym, pieceCapOverride:null, overrideReason:'', overrideBy:'', overrideAt:''};
      STATE.months.push(month);
    }
    let week = STATE.weeks.find(w=>w.monthId===month.id && w._isMonthlyImportWeek);
    if(!week){
      const range = monthRange(ym);
      week = {
        id: uid('week'), monthId: month.id, startDate: range.start, endDate: range.end,
        workdays: monthWorkdays(ym), styleCapOverride:null, pieceCapPlanOverride:null, pieceCapOpsOverride:null,
        overrideReason:'歷史月度資料匯入，未拆分至週', overrideBy:'系統匯入', overrideAt: nowStr(),
        _isMonthlyImportWeek: true
      };
      STATE.weeks.push(week);
    }
    const data = HISTORICAL_MONTHLY[ym];
    Object.keys(data).forEach(bn=>{
      const brand = STATE.brands.find(x=>x.name===bn);
      if(!brand) return;
      const already = STATE.forecasts.find(f=>f.brandId===brand.id && f.weekId===week.id && f.status!=='cancelled');
      if(already) return;
      const [styles, pieces] = data[bn];
      const ts = nowStr();
      STATE.forecasts.push({
        id: uid('fc'), brandId: brand.id, weekId: week.id, itemRef:'', styles, pieces,
        note:'歷史月度合計匯入（來源：Washing_sample_projection_system.xlsx，僅月度總數，未拆分至週）',
        status:'active', createdBy:'系統匯入', createdAt: ts, modifiedBy:'系統匯入', modifiedAt: ts,
        history:[{at:ts, by:'系統匯入', from:null, to:{styles,pieces}}]
      });
    });
  });

  STATE._historicalImportV1 = true;
}

/* ============================= 計算邏輯 ============================= */
function weekDefaults(workdays){
  return {
    styleCap: STYLE_PER_DAY*workdays,
    pieceCapPlan: PIECES_PLAN_PER_DAY*workdays,
    pieceCapOps: PIECES_OPS_PER_DAY*workdays
  };
}
function weekCaps(week){
  const d = weekDefaults(week.workdays);
  return {
    styleCap: week.styleCapOverride!=null ? week.styleCapOverride : d.styleCap,
    pieceCapPlan: week.pieceCapPlanOverride!=null ? week.pieceCapPlanOverride : d.pieceCapPlan,
    pieceCapOps: week.pieceCapOpsOverride!=null ? week.pieceCapOpsOverride : d.pieceCapOps,
    defaults: d
  };
}
function activeForecastsForWeek(weekId){
  return STATE.forecasts.filter(f=>f.weekId===weekId && f.status!=='cancelled');
}
function weekTotals(weekId){
  const fs = activeForecastsForWeek(weekId);
  return {
    styles: fs.reduce((s,f)=>s+(f.styles||0),0),
    pieces: fs.reduce((s,f)=>s+(f.pieces||0),0)
  };
}
function weekStatus(week){
  const caps = weekCaps(week);
  const tot = weekTotals(week.id);
  const styleRatio = caps.styleCap>0 ? tot.styles/caps.styleCap : 0;
  const planRatio = caps.pieceCapPlan>0 ? tot.pieces/caps.pieceCapPlan : 0;
  const opsRatio = caps.pieceCapOps>0 ? tot.pieces/caps.pieceCapOps : 0;

  let level = 'normal'; // normal | near | at | over
  let reasons = [];
  if(tot.styles >= caps.styleCap){
    level = 'at';
    reasons.push('本週預計 '+tot.styles+' 款，已達或超過上限 '+caps.styleCap+' 款（超出 '+Math.max(0,tot.styles-caps.styleCap)+' 款）');
  } else if(styleRatio>=0.9){
    if(level==='normal') level='near';
    reasons.push('本週預計 '+tot.styles+' 款，達款數上限 '+caps.styleCap+' 款的 '+Math.round(styleRatio*100)+'%');
  }
  if(tot.pieces >= caps.pieceCapOps){
    level='over';
    reasons.push('本週預計 '+tot.pieces+' 件，已超出 425 件/日操作參考上限 '+caps.pieceCapOps+' 件（超出 '+(tot.pieces-caps.pieceCapOps)+' 件），將標記待 WRD 覆核');
  } else if(tot.pieces >= caps.pieceCapPlan){
    if(level!=='over') level = level==='at' ? 'at' : 'at';
    reasons.push('本週預計 '+tot.pieces+' 件，已達 400 件/日規劃參考 '+caps.pieceCapPlan+' 件（超出 '+(tot.pieces-caps.pieceCapPlan)+' 件）');
  } else if(planRatio>=0.9){
    if(level==='normal') level='near';
    reasons.push('本週預計 '+tot.pieces+' 件，達件數規劃參考 '+caps.pieceCapPlan+' 件的 '+Math.round(planRatio*100)+'%');
  }
  return {level, reasons, caps, tot};
}
function monthCaps(month){
  const weeks = STATE.weeks.filter(w=>w.monthId===month.id);
  const styleCap = weeks.reduce((s,w)=>s+weekCaps(w).styleCap,0);
  const pieceCap = month.pieceCapOverride!=null ? month.pieceCapOverride : MONTH_PIECE_CAP_DEFAULT;
  return {styleCap, pieceCap, weeks};
}
function monthTotals(month){
  const weeks = STATE.weeks.filter(w=>w.monthId===month.id);
  let styles=0, pieces=0;
  weeks.forEach(w=>{ const t=weekTotals(w.id); styles+=t.styles; pieces+=t.pieces; });
  return {styles, pieces};
}
function monthStatus(month){
  const caps = monthCaps(month);
  const tot = monthTotals(month);
  let level='normal';
  let reasons=[];
  if(tot.pieces > 10400){
    level='over';
    reasons.push('本月件數已達 '+tot.pieces+' 件，超出高負荷規劃參考上限 10,400 件（超出 '+(tot.pieces-10400)+' 件），需移期、調整資源或作明確管理決定');
  } else if(tot.pieces >= 10000){
    level='at';
    reasons.push('本月件數已達 '+tot.pieces+' 件，落在 10,000–10,400 件高負荷需覆核區間');
  } else if(tot.pieces >= 9000){
    level='near';
    reasons.push('本月件數已達 '+tot.pieces+' 件，接近月度正式基準 10,000 件，需持續監控');
  }
  if(tot.styles > caps.styleCap && caps.styleCap>0){
    if(level==='normal') level='at';
    reasons.push('本月款數 '+tot.styles+' 已超出各週上限合計 '+caps.styleCap+' 款');
  }
  return {level, reasons, caps, tot};
}
function weekLabel(week){
  return week.startDate + ' ~ ' + week.endDate;
}
function brandName(id){ const b=STATE.brands.find(x=>x.id===id); return b?b.name:'(未知客戶)'; }

/* ============================= 資料操作（含稽核）============================= */
function currentUser(){ return SESSION.userName || '(未署名使用者)'; }

function upsertForecast({brandId, weekId, itemRef, styles, pieces, note}, forceStatus){
  itemRef = itemRef || '';
  let existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===weekId && (f.itemRef||'')===itemRef && f.status!=='cancelled');
  const ts = nowStr();
  if(existing){
    existing.history = existing.history || [];
    existing.history.push({at:ts, by:currentUser(), from:{styles:existing.styles, pieces:existing.pieces, note:existing.note}, to:{styles, pieces, note}});
    existing.styles = styles; existing.pieces = pieces; existing.note = note;
    existing.modifiedBy = currentUser(); existing.modifiedAt = ts;
    if(forceStatus) existing.status = forceStatus;
    else if(existing.status==='draft') existing.status='active';
  } else {
    existing = {
      id: uid('fc'), brandId, weekId, itemRef, styles, pieces, note,
      status: forceStatus || 'active',
      createdBy: currentUser(), createdAt: ts, modifiedBy: currentUser(), modifiedAt: ts,
      history: [{at:ts, by:currentUser(), from:null, to:{styles,pieces,note}}]
    };
    STATE.forecasts.push(existing);
  }
  return existing;
}
function cancelForecast(id){
  const f = STATE.forecasts.find(x=>x.id===id);
  if(!f) return;
  f.history = f.history||[];
  f.history.push({at:nowStr(), by:currentUser(), from:{status:f.status}, to:{status:'cancelled'}});
  f.status='cancelled'; f.modifiedBy=currentUser(); f.modifiedAt=nowStr();
}

      const ro = lockedForMe ? 'readonly title="此資料由其他人輸入，僅 WRD／系統管理員可修改"' : '';

    },0);
    return `<tr><td class="brandcol">${brand.name}</td>${cells}<td class="rowtotal">${rowMonthTotal.toLocaleString()} 件</td></tr>`;
  }).join('');

  const footCells = weeks.map(w=>{

    return `<td>${tot.styles}/${caps.styleCap} 款<br>${tot.pieces}/${caps.pieceCapPlan} 件</td>`;

  if(mStat.level!=='normal'){

      <div class="muted footnote">同一使用者再次輸入同一客戶／週別將更新既有資料，不會重複累計。留空表示「未填報」；填 0 表示「確認無預測量」。</div>
    </div>
    <div class="matrix-wrap">
      <table class="matrix">
        <thead><tr><th class="brandcol">客戶／品牌</th>${headerCells}<th style="min-width:100px;">月度合計</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="${weeks.length+2}" class="empty">尚無啟用中的客戶／品牌</td></tr>`}</tbody>
        <tfoot><tr class="weekfoot"><td class="brandcol">週上限（款／件規劃）</td>${footCells}<td></td></tr></tfoot>
      </table>
    </div>
    <p class="footnote">款數與件數輸入後失焦即自動儲存並重新計算。若本週已達或超過上限，系統會要求確認後才儲存。</p>
  `;
}
function bindMatrix(){
  document.querySelectorAll('[data-monthpill]').forEach(p=>{
    p.onclick=()=>{ VIEW.matrixMonthId = p.dataset.monthpill; render(); };
  });
  document.querySelectorAll('table.matrix input').forEach(inp=>{
    inp.addEventListener('change', ()=>handleMatrixInputChange(inp));
  });
}
function handleMatrixInputChange(inp){
  const brandId = inp.dataset.brand, weekId = inp.dataset.week, field = inp.dataset.field;
  let raw = inp.value.trim();
  let val = raw==='' ? null : Math.max(0, Math.floor(Number(raw)));
  if(raw!=='' && (isNaN(val))) { alert('請輸入非負整數'); render(); return; }

  const existing = STATE.forecasts.find(f=>f.brandId===brandId && f.weekId===weekId && f.status!=='cancelled' && !f.itemRef);

  if(existing && existing.createdBy !== currentUser() && !isPrivileged()){
    alert('此資料由「'+existing.createdBy+'」輸入，只有 WRD 或系統管理員可以修改他人資料。');
    render();
    return;
  }

  let styles = existing ? existing.styles : 0;
  let pieces = existing ? existing.pieces : 0;
  if(field==='styles') styles = val==null? 0 : val;
  if(field==='pieces') pieces = val==null? 0 : val;

  // if both fields now empty/zero-null and no existing record and user cleared -> do nothing (blank = 未填報)
  const bothBlank = (field==='styles' ? val==null : (existing? existing.styles===0 && !existing._touchedStyles : true)) &&
                     (field==='pieces' ? val==null : (existing? existing.pieces===0 && !existing._touchedPieces : true));
  if(!existing && val==null){ render(); return; }

  const week = STATE.weeks.find(w=>w.id===weekId);
  const caps = weekCaps(week);
  const projectedTotals = weekTotals(weekId);
  // remove existing contribution before adding projected
  const prevContribStyles = existing? existing.styles||0 : 0;
  const prevContribPieces = existing? existing.pieces||0 : 0;
  const newStyleTotal = projectedTotals.styles - prevContribStyles + styles;
  const newPieceTotal = projectedTotals.pieces - prevContribPieces + pieces;

  const overStyleCap = newStyleTotal >= caps.styleCap && caps.styleCap>0;
  const overOpsCap = newPieceTotal >= caps.pieceCapOps && caps.pieceCapOps>0;
  const overPlanCap = newPieceTotal >= caps.pieceCapPlan && caps.pieceCapPlan>0;

  const doSave = (forceStatus)=>{
    upsertForecast({brandId, weekId, itemRef:'', styles, pieces, note:''}, forceStatus);
    persist().then(render);
  };

  if(overOpsCap || overStyleCap){
    PENDING_CONFIRM = {
      level: overOpsCap ? 'deep' : 'normal',
      title: overOpsCap ? '超出 425 件／日操作參考' : '已達／超過週上限',
      message: overOpsCap
        ? `本週預計件數將達 ${newPieceTotal} 件，超出操作參考上限 ${caps.pieceCapOps} 件。儲存後將自動標記「待 WRD 覆核」。是否確認儲存？`
        : `本週預計款數將達 ${newStyleTotal} 款，較上限 ${caps.styleCap} 款超出 ${Math.max(0,newStyleTotal-caps.styleCap)} 款。是否確認儲存？`,
      onConfirm: ()=>{ doSave(overOpsCap ? 'pending_review' : undefined); PENDING_CONFIRM=null; },
      onCancel: ()=>{ PENDING_CONFIRM=null; render(); }
    };
    render();
    return;
  }
  doSave(overPlanCap ? undefined : undefined);
}

/* ============================= 匯出 ============================= */
function renderExport(){
  const months = [...STATE.months].sort((a,b)=>a.ym.localeCompare(b.ym));
  const options = months.map(m=>`<option value="${m.id}">${monthLabel(m.ym)}</option>`).join('');
  return `
    <h1 class="page-title">匯出</h1>
    <p class="page-sub">匯出目前篩選範圍內的逐筆預測資料為 CSV，供會議、追溯與離線分析使用。</p>
    <div class="field-row">
      <div class="field"><label>選擇月份</label><select id="exportMonth"><option value="">全部月份</option>${options}</select></div>
      <button class="btn" id="exportBtn">匯出 CSV</button>
    </div>
    <p class="footnote">匯出內容包含客戶／品牌、業務週、款數、件數、狀態、建立與修改人員及時間，與畫面篩選範圍一致。</p>
  `;
}
function bindExport(){
  const btn = document.getElementById('exportBtn');
  if(!btn) return;
  btn.onclick = ()=>{
    const monthId = document.getElementById('exportMonth').value;
    let fs = STATE.forecasts.filter(f=>f.status!=='cancelled');
    if(monthId){
      const weekIds = new Set(STATE.weeks.filter(w=>w.monthId===monthId).map(w=>w.id));
      fs = fs.filter(f=>weekIds.has(f.weekId));
    }
    const rows = [['客戶／品牌','業務週起','業務週迄','規劃月份','項目參考','款數','件數','狀態','備註','建立人','建立時間','最後修改人','最後修改時間']];
    fs.forEach(f=>{
      const week = STATE.weeks.find(w=>w.id===f.weekId);
      const month = week? STATE.months.find(m=>m.id===week.monthId) : null;
      rows.push([brandName(f.brandId), week?week.startDate:'', week?week.endDate:'', month?monthLabel(month.ym):'',
        f.itemRef||'', f.styles, f.pieces, statusLabel(f.status), f.note||'', f.createdBy, f.createdAt, f.modifiedBy, f.modifiedAt]);
    });
    downloadCsv('WSPS_forecast_export_'+fmtDate(new Date())+'.csv', rows);
  };
}

/* ============================= 啟動 ============================= */
(async function init(){
  render();
  if(!HAS_CLOUD_STORAGE){
    await new Promise(resolve => {
      if(window.firebaseGetData || window.firebaseError) return resolve();
      window.addEventListener('firebase-ready', resolve, {once:true});
      setTimeout(resolve, 5000);
    });
    USING_FIREBASE = !!window.firebaseGetData && !window.firebaseError;
    if(!USING_FIREBASE){
      CLOUD_ERROR = window.firebaseError || new Error('WSPS 共用資料庫未連線。');
      const hint = document.getElementById('saveHint');
      if(hint){ hint.textContent = '未連線：目前不可同步'; hint.classList.add('show'); }
    }
  }
  await loadState();
  render();
})();
</script>
</body>
</html>
